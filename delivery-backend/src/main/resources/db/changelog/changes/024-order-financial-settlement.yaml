databaseChangeLog:
  - changeSet:
      id: 024-order-financial-settlement
      author: delivery
      changes:
        - createTable:
            schemaName: delivery
            tableName: courier_service_financial_settings
            columns:
              - column:
                  name: courier_service_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: platform_fee_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: platform_fee_type
                  type: varchar(32)
                  defaultValue: PERCENT
                  constraints:
                    nullable: false
              - column:
                  name: platform_fee_value
                  type: numeric(14, 4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: delivery
            baseTableName: courier_service_financial_settings
            baseColumnNames: courier_service_id
            referencedTableSchemaName: delivery
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_courier_service_financial_settings_service
        - createTable:
            schemaName: delivery
            tableName: order_financial_snapshots
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: delivery_price
                  type: numeric(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: platform_fee_enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: platform_fee_type
                  type: varchar(32)
              - column:
                  name: platform_fee_value
                  type: numeric(14, 4)
              - column:
                  name: platform_fee_amount
                  type: numeric(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: partner_reward_amount
                  type: numeric(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: courier_net_earning
                  type: numeric(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: partner_rule_id
                  type: uuid
              - column:
                  name: details_snapshot
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: delivery
            baseTableName: order_financial_snapshots
            baseColumnNames: order_id
            referencedTableSchemaName: delivery
            referencedTableName: delivery_orders
            referencedColumnNames: id
            constraintName: fk_order_financial_snapshot_order
        - sql:
            splitStatements: false
            sql: |
              CREATE UNIQUE INDEX uq_order_financial_snapshot_order
              ON delivery.order_financial_snapshots (order_id);
