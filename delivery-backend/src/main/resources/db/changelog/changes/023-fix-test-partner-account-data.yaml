databaseChangeLog:
  - changeSet:
      id: 023-fix-test-partner-account-data
      author: delivery
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Remove erroneous test payout (500 ₽) created while account showed wrong available balance.
              DELETE FROM delivery.partner_payout_requests
              WHERE id = 'f4c2f36c-2d11-4c94-843e-26389ea65ea6'
                AND partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                AND amount = 500.00
                AND status = 'SCHEDULED';

              -- Set payout availability date for existing accrual (COURIER→COURIER rule: day 7).
              UPDATE delivery.partner_accruals
              SET available_from = TIMESTAMPTZ '2026-07-07 00:00:00+00'
              WHERE id = 'efeb8e88-9d49-4b2b-af9c-4b4ec2926d52'
                AND partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                AND amount = 50.00;

              -- Reconcile denormalized partner_accounts from accrual sources.
              UPDATE delivery.partner_accounts pa
              SET balance = COALESCE(src.accrued, 0),
                  available_for_payout = GREATEST(
                    COALESCE(src.accrued, 0)
                      - COALESCE(src.awaiting, 0)
                      - COALESCE(src.pending, 0)
                      - COALESCE(src.paid, 0)
                      - COALESCE(src.transferred, 0),
                    0),
                  pending_payout = COALESCE(src.pending, 0),
                  paid_out = COALESCE(src.paid, 0),
                  transferred_to_main_balance = COALESCE(src.transferred, 0),
                  updated_at = NOW()
              FROM (
                SELECT
                  '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'::uuid AS account_id,
                  (SELECT COALESCE(SUM(amount), 0)
                   FROM delivery.partner_accruals
                   WHERE partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                     AND status = 'ACCRUED') AS accrued,
                  (SELECT COALESCE(SUM(amount), 0)
                   FROM delivery.partner_accruals
                   WHERE partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                     AND status = 'ACCRUED'
                     AND available_from > NOW()) AS awaiting,
                  (SELECT COALESCE(SUM(amount), 0)
                   FROM delivery.partner_payout_requests
                   WHERE partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                     AND status IN ('PENDING', 'SCHEDULED')) AS pending,
                  (SELECT COALESCE(SUM(amount), 0)
                   FROM delivery.partner_payout_requests
                   WHERE partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                     AND status = 'PAID'
                     AND payout_method = 'BANK_TRANSFER') AS paid,
                  (SELECT COALESCE(SUM(amount), 0)
                   FROM delivery.partner_payout_requests
                   WHERE partner_account_id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8'
                     AND status = 'PAID'
                     AND payout_method = 'TRANSFER_TO_MAIN_BALANCE') AS transferred
              ) src
              WHERE pa.id = src.account_id
                AND pa.id = '8e5afea7-4a15-4c92-b8ff-714e067fb8b8';
