databaseChangeLog:
  - changeSet:
      id: 021-courier-balance-payout-requests
      author: delivery
      changes:
        - createTable:
            schemaName: delivery
            tableName: courier_balance_payout_requests
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: courier_member_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: payout_method
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz
              - column:
                  name: processed_by
                  type: bigint
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: delivery
            baseTableName: courier_balance_payout_requests
            baseColumnNames: courier_member_id
            referencedTableSchemaName: delivery
            referencedTableName: organization_members
            referencedColumnNames: id
            constraintName: fk_courier_balance_payout_member
        - createIndex:
            schemaName: delivery
            tableName: courier_balance_payout_requests
            indexName: idx_courier_balance_payout_member_created
            columns:
              - column:
                  name: courier_member_id
              - column:
                  name: created_at
                  descending: true
