databaseChangeLog:
  - changeSet:
      id: 021-branch-fulfillment-pricing-mode
      author: delivery
      changes:
        - addColumn:
            schemaName: delivery
            tableName: branch_fulfillment_settings
            columns:
              - column:
                  name: delivery_pricing_mode
                  type: VARCHAR(16)
                  defaultValue: FLAT
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE delivery.branch_fulfillment_settings
                ADD CONSTRAINT chk_bfs_pricing_mode
                  CHECK (delivery_pricing_mode IN ('FLAT', 'ZONES'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE delivery.branch_fulfillment_settings
                DROP CONSTRAINT IF EXISTS chk_bfs_pricing_mode;
        - dropColumn:
            schemaName: delivery
            tableName: branch_fulfillment_settings
            columnName: delivery_pricing_mode

  - changeSet:
      id: 021-delivery-zones
      author: delivery
      changes:
        - createTable:
            schemaName: delivery
            tableName: delivery_zone
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: company_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: geometry
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: delivery_fee_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: free_delivery_from_minor
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: min_order_amount_minor
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: eta_min_minutes
                  type: INTEGER
                  constraints:
                    nullable: true
              - column:
                  name: eta_max_minutes
                  type: INTEGER
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_by_user_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - createIndex:
            schemaName: delivery
            tableName: delivery_zone
            indexName: idx_delivery_zone_branch_id
            columns:
              - column:
                  name: branch_id
        - createIndex:
            schemaName: delivery
            tableName: delivery_zone
            indexName: idx_delivery_zone_organization_id
            columns:
              - column:
                  name: organization_id
        - createIndex:
            schemaName: delivery
            tableName: delivery_zone
            indexName: idx_delivery_zone_match
            columns:
              - column:
                  name: branch_id
              - column:
                  name: active
              - column:
                  name: priority
        - sql:
            sql: |
              ALTER TABLE delivery.delivery_zone
                ADD CONSTRAINT chk_delivery_zone_name
                  CHECK (char_length(btrim(name)) BETWEEN 1 AND 80);
              ALTER TABLE delivery.delivery_zone
                ADD CONSTRAINT chk_delivery_zone_money
                  CHECK (
                    delivery_fee_minor >= 0
                    AND delivery_fee_minor <= 100000000
                    AND (free_delivery_from_minor IS NULL OR (free_delivery_from_minor >= 0 AND free_delivery_from_minor <= 100000000))
                    AND (min_order_amount_minor IS NULL OR (min_order_amount_minor >= 0 AND min_order_amount_minor <= 100000000))
                  );
              ALTER TABLE delivery.delivery_zone
                ADD CONSTRAINT chk_delivery_zone_eta
                  CHECK (
                    (eta_min_minutes IS NULL AND eta_max_minutes IS NULL)
                    OR (
                      eta_min_minutes BETWEEN 1 AND 1440
                      AND eta_max_minutes BETWEEN 1 AND 1440
                      AND eta_min_minutes <= eta_max_minutes
                    )
                  );
              ALTER TABLE delivery.delivery_zone
                ADD CONSTRAINT chk_delivery_zone_priority
                  CHECK (priority BETWEEN -1000000 AND 1000000);
      rollback:
        - dropTable:
            schemaName: delivery
            tableName: delivery_zone
