databaseChangeLog:
  - changeSet:
      id: 004-order-channel-posts-status
      author: delivery
      changes:
        - addColumn:
            schemaName: delivery
            tableName: order_channel_posts
            columns:
              - column:
                  name: status
                  type: varchar(16)
              - column:
                  name: error_message
                  type: text
              - column:
                  name: updated_at
                  type: timestamptz
        - sql:
            sql: >
              UPDATE delivery.order_channel_posts
              SET status = CASE WHEN external_message_id IS NOT NULL THEN 'sent' ELSE 'failed' END,
                  updated_at = COALESCE(created_at, CURRENT_TIMESTAMP)
              WHERE status IS NULL
        - addNotNullConstraint:
            schemaName: delivery
            tableName: order_channel_posts
            columnName: status
            columnDataType: varchar(16)
        - addNotNullConstraint:
            schemaName: delivery
            tableName: order_channel_posts
            columnName: updated_at
            columnDataType: timestamptz
