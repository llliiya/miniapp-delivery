# envsubst при старте: только DOMAIN (см. NGINX_ENVSUBST_FILTER в compose).

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://${host}${request_uri};
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml "application/xml+rss";

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host ${host};
        proxy_set_header X-Real-IP ${remote_addr};
        proxy_set_header X-Forwarded-For ${proxy_add_x_forwarded_for};
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files ${uri} /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)\z {
        expires 7d;
        add_header Cache-Control "public";
        try_files ${uri} =404;
    }
}
