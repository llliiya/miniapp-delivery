# Prod delivery-стек на выделенной машине.
# Публичные порты: 80, 443. Запуск: deploy/deploy-delivery-full.sh
# Перед деплоем: certbot для 85.239.58.129.sslip.io

name: delivery

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME_strong_db_password
    ports:
      - "5432:5432"
    volumes:
      - delivery_prod_pg:/var/lib/postgresql/data
      - ./docker/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./docker/db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 12

  account:
    build:
      context: ..
      dockerfile: miniapp-account/Dockerfile.stack
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/delivery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: CHANGE_ME_strong_db_password
      JWT_SECRET: ОченьСекретныйКлюч1234567890
      MINAPP_INTERNAL_MONOLITH_KEY: dev-monolith-internal-key
      MINAPP_NOTIFICATION_BASE_URL: http://notification:8093
      FRONTEND_URL: https://85.239.58.129.sslip.io
      TG_TOKEN: "8989575508:AAFyJdP_94vN4I1jUfTOTLuxEj0Wlv7BM6A"
      TG_USERNAME: dobrovoz_test_bot
      PLUSOFON_API_KEY: ""
      PLUSOFON_CLIENT_ID: ""
      PLUSOFON_DEV: "false"
      BYPASS_VERIFICATION_CODES: "false"
      SMTP_HOST: smtp.mail.ru
      SMTP_PORT: "465"
      SMTP_USERNAME: dobrovoz_rabota@mail.ru
      SMTP_PASSWORD: B9ugJXTePoGetV9eESFS
      SMTP_SSL_ENABLE: "true"
      SMTP_STARTTLS_ENABLE: "false"
      MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      DELIVERY_MAX_BOT_TOKEN: f9LHodD0cOIKsk341MQb4ixK8Mmg-LpmXVW4MpNTDm84XXIszKxRYYFYJRQ1NvGDJ8-_9Icw7NmTp-Z8QEp8

  notification:
    build:
      context: ..
      dockerfile: miniapp-notification/Dockerfile.stack
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://db:5432/delivery
      NOTIFICATION_DB_USERNAME: postgres
      NOTIFICATION_DB_PASSWORD: CHANGE_ME_strong_db_password

  delivery-backend:
    build:
      context: ..
      dockerfile: miniapp-delivery/delivery-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      DELIVERY_SERVER_PORT: "9081"
      DELIVERY_DB_URL: jdbc:postgresql://db:5432/delivery?currentSchema=delivery
      DELIVERY_DB_USERNAME: postgres
      DELIVERY_DB_PASSWORD: CHANGE_ME_strong_db_password
      JWT_SECRET: ОченьСекретныйКлюч1234567890
      MINAPP_ACCOUNT_BASE_URL: http://account:8092
      MINAPP_INTERNAL_MONOLITH_KEY: dev-monolith-internal-key
      MINAPP_NOTIFICATION_BASE_URL: http://notification:8093
      FRONTEND_DELIVERY_URL: https://85.239.58.129.sslip.io
      DELIVERY_PUBLIC_API_URL: https://85.239.58.129.sslip.io
      TG_TOKEN: "8989575508:AAFyJdP_94vN4I1jUfTOTLuxEj0Wlv7BM6A"
      TG_BOT_USERNAME: dobrovoz_test_bot
      TG_BOT_MINI_APP_SHORT_NAME: ""
      TG_ADMIN_CHAT_ID: "@llliiya"
      MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      DELIVERY_MAX_BOT_TOKEN: f9LHodD0cOIKsk341MQb4ixK8Mmg-LpmXVW4MpNTDm84XXIszKxRYYFYJRQ1NvGDJ8-_9Icw7NmTp-Z8QEp8
      DELIVERY_MAX_BOT_USERNAME: id544601208994_3_bot
      MAX_BOT_USERNAME: id544601208994_1_bot

  gateway:
    build:
      context: ..
      dockerfile: miniapp-delivery/docker/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - account
      - notification
      - delivery-backend
    environment:
      GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: https://85.239.58.129.sslip.io
      GATEWAY_URI_MINAPP_ACCOUNT: http://account:8092
      GATEWAY_URI_MINIAPP_NOTIFICATION: http://notification:8093
      GATEWAY_URI_DELIVERY_BACKEND: http://delivery-backend:9081
      GATEWAY_URI_MINIAPP_BACKEND: http://delivery-backend:9081
      GATEWAY_URI_MEDIA_SERVICE: http://notification:8093

  delivery-frontend:
    build:
      context: ./delivery-frontend
      dockerfile: Dockerfile
      args:
        VITE_ENV: production
        VITE_API_BASE_URL: https://85.239.58.129.sslip.io
        VITE_YANDEX_MAPS_API_KEY: fdd12e01-6106-4541-bd92-d611fd0f9ae8
        VITE_DGIS_API_KEY: ""
    restart: unless-stopped
    environment:
      DOMAIN: 85.239.58.129.sslip.io
      NGINX_ENVSUBST_FILTER: "^(DOMAIN)$$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./delivery-frontend/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway

volumes:
  delivery_prod_pg:

networks:
  default:
    name: delivery_prod
