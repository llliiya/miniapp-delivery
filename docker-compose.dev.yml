# Локальный delivery-стек (из корня valentin).
# Запуск: docker compose -f miniapp-delivery/docker-compose.dev.yml up --build -d

name: delivery_dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - delivery_dev_pg:/var/lib/postgresql/data
      - ./docker/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 12

  account:
    build:
      context: ..
      dockerfile: miniapp-account/Dockerfile.stack
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/delivery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ОченьСекретныйКлюч1234567890
      MINAPP_INTERNAL_MONOLITH_KEY: dev-monolith-internal-key
      MINAPP_NOTIFICATION_BASE_URL: http://notification:8093
      FRONTEND_URL: http://localhost:5173
      TG_TOKEN: "8405160303:AAEyDBS-zGqFZR9rjpTZxbkVk0yU31JD8HE"
      TG_USERNAME: podrabotka_miniapp_bot
      MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      DELIVERY_MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      SMTP_HOST: ""
      SMTP_PORT: "465"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SSL_ENABLE: "true"
      SMTP_STARTTLS_ENABLE: "false"
      BYPASS_VERIFICATION_CODES: "true"

  notification:
    build:
      context: ..
      dockerfile: miniapp-notification/Dockerfile.stack
    depends_on:
      db:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://db:5432/delivery
      NOTIFICATION_DB_USERNAME: postgres
      NOTIFICATION_DB_PASSWORD: postgres
      MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj

  delivery-backend:
    build:
      context: ..
      dockerfile: miniapp-delivery/delivery-backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      DELIVERY_SERVER_PORT: "9081"
      SPRING_PROFILES_ACTIVE: dev
      DELIVERY_DB_URL: jdbc:postgresql://db:5432/delivery?currentSchema=delivery
      DELIVERY_DB_USERNAME: postgres
      DELIVERY_DB_PASSWORD: postgres
      JWT_SECRET: ОченьСекретныйКлюч1234567890
      MINAPP_ACCOUNT_BASE_URL: http://account:8092
      MINAPP_INTERNAL_MONOLITH_KEY: dev-monolith-internal-key
      MINAPP_NOTIFICATION_BASE_URL: http://notification:8093
      FRONTEND_DELIVERY_URL: http://localhost:5173
      DELIVERY_PUBLIC_API_URL: http://localhost:5173
      TG_TOKEN: "8405160303:AAEyDBS-zGqFZR9rjpTZxbkVk0yU31JD8HE"
      TG_BOT_USERNAME: podrabotka_miniapp_bot
      TG_ADMIN_CHAT_ID: "@llliiya"
      MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      DELIVERY_MAX_BOT_TOKEN: f9LHodD0cOI9Cgyg3wNIPOCRlK40U1JJKsB6sf7rRIAfeIhmRM4cPi-FhXeycgbakJPzUo7CP7Q_s5R4uNtj
      DELIVERY_MAX_BOT_USERNAME: id544601208994_3_bot
      MAX_BOT_USERNAME: id544601208994_1_bot

  gateway:
    build:
      context: ..
      dockerfile: miniapp-delivery/docker/Dockerfile.gateway
    depends_on:
      - account
      - notification
      - delivery-backend
    ports:
      - "8080:8080"
    environment:
      GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: "*"
      GATEWAY_URI_MINAPP_ACCOUNT: http://account:8092
      GATEWAY_URI_MINIAPP_NOTIFICATION: http://notification:8093
      GATEWAY_URI_DELIVERY_BACKEND: http://delivery-backend:9081
      GATEWAY_URI_MINIAPP_BACKEND: http://delivery-backend:9081
      GATEWAY_URI_MEDIA_SERVICE: http://notification:8093

  delivery-frontend:
    build:
      context: ./delivery-frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_ENV: dev
        VITE_API_BASE_URL: http://localhost:5173
        VITE_YANDEX_MAPS_API_KEY: ""
        VITE_DGIS_API_KEY: ""
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  delivery_dev_pg:

networks:
  default:
    name: delivery_dev
